<!DOCTYPE html>
<html>
<head>
    <title>Direct Gmail API Sender</title>
    <script src="https://accounts.google.com/gsi/client" onload="initClient()"></script>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; display: flex; flex-direction: column; gap: 10px; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; cursor: pointer; background: #4285F4; color: white; border: none; border-radius: 4px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Direct Gmail Sender (No GAS)</h2>
    
    <button id="authBtn" onclick="getToken()">1. Authorize & Login</button>
    <p id="userStatus">Not logged in.</p>

    <div id="composer" class="hidden">
        <input type="text" id="to" placeholder="To: recipient@example.com">
        <input type="text" id="subject" placeholder="Subject">
        <textarea id="body" rows="5" placeholder="Email body..."></textarea>
        <input type="file" id="fileInput">
        <button id="sendBtn" onclick="sendDirect()">2. Send Email Directly</button>
    </div>

    <script>
        let tokenClient;
        let accessToken = null;

        // Configuration
        const CLIENT_ID = 'Y80417045238-9mmbrbbt33rifgmedhb9okf9rcj64af0.apps.googleusercontent.com';

        function initClient() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/gmail.send',
                callback: (tokenResponse) => {
                    accessToken = tokenResponse.access_token;
                    document.getElementById('userStatus').innerText = "Authorized!";
                    document.getElementById('composer').classList.remove('hidden');
                    document.getElementById('authBtn').innerText = "Change Account";
                },
            });
        }

        function getToken() {
            tokenClient.requestAccessToken();
        }

        async function sendDirect() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const to = document.getElementById('to').value;
            const subject = document.getElementById('subject').value;
            const body = document.getElementById('body').value;

            // 1. Build the MIME Message
            const boundary = "__boundary__";
            let email = [
                `To: ${to}`,
                `Subject: ${subject}`,
                'MIME-Version: 1.0',
                `Content-Type: multipart/mixed; boundary="${boundary}"`,
                '',
                `--${boundary}`,
                'Content-Type: text/html; charset="UTF-8"',
                '',
                body,
                ''
            ].join('\r\n');

            if (file) {
                const base64File = await toBase64(file);
                const content = base64File.split(',')[1];
                email += [
                    `--${boundary}`,
                    `Content-Type: ${file.type}; name="${file.name}"`,
                    'Content-Transfer-Encoding: base64',
                    `Content-Disposition: attachment; filename="${file.name}"`,
                    '',
                    content,
                    ''
                ].join('\r\n');
            }

            email += `--${boundary}--`;

            // 2. Base64URL Encode the entire message
            const encodedEmail = btoa(unescape(encodeURIComponent(email)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

            // 3. POST to Google API
            const response = await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${accessToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ raw: encodedEmail })
            });

            if (response.ok) {
                alert("Email sent directly from browser!");
            } else {
                const err = await response.json();
                console.error(err);
                alert("Error: " + err.error.message);
            }
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    </script>
</body>
</html>
