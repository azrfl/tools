


<!DOCTYPE html>
<html>
<head>
    <title>Internal Mail Portal</title>
    <script src="https://accounts.google.com/gsi/client" onload="initClient()"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; line-height: 1.6; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        .user-info { background: #f4f4f4; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        button { padding: 10px 20px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 4px; }
        #changeAcc { background: #5f6368; font-size: 12px; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>Compose Email (Internal)</h2>

    <div id="authSection" class="user-info">
        <p id="userStatus">Checking authentication...</p>
        <button id="loginBtn" style="display:none;" onclick="getToken()">Login with Google</button>
        <button id="changeAcc" style="display:none;" onclick="revokeToken()">Change Email</button>
    </div>

    <div id="mailForm">
        <input type="text" id="to" placeholder="Recipient (To)">
        <input type="text" id="cc" placeholder="CC">
        <input type="text" id="subject" placeholder="Subject">
        <textarea id="body" rows="6" placeholder="HTML Body content..."></textarea>
        
        <button id="sendBtn" onclick="sendEmail()" disabled>Send Email</button>
        <p id="senderLabel" style="font-size: 12px; color: #666;"></p>
    </div>

    <script>
        let client;
        let access_token = null;
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwkRV9MWUl_XZe5QASoDvZmTXc8fX36h-CzaYzGM7l-R4EDNmhBj2kakw9F7s84aadV/exec';
        const CLIENT_ID = 'Y80417045238-9mmbrbbt33rifgmedhb9okf9rcj64af0.apps.googleusercontent.com';

        function initClient() {
            client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/userinfo.email',
                callback: (response) => {
                    if (response.access_token) {
                        access_token = response.access_token;
                        fetchUserInfo();
                    }
                },
            });
        }

        function getToken() {
            client.requestAccessToken();
        }

        function revokeToken() {
            google.accounts.oauth2.revoke(access_token, () => {
                access_token = null;
                location.reload();
            });
        }

        async function fetchUserInfo() {
            const resp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: `Bearer ${access_token}` }
            });
            const info = await resp.json();
            document.getElementById('userStatus').innerText = "Logged in as: " + info.email;
            document.getElementById('senderLabel').innerText = "(send as " + info.email + ")";
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('loginBtn').style.display = 'none';
            document.getElementById('changeAcc').style.display = 'inline-block';
        }

        async function sendEmail() {
            const btn = document.getElementById('sendBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            const payload = {
                to: document.getElementById('to').value,
                cc: document.getElementById('cc').value,
                subject: document.getElementById('subject').value,
                body: document.getElementById('body').value
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors', // Crucial for external apps
                    headers: {
                        'Authorization': 'Bearer ' + access_token,
                        'Content-Type': 'text/plain;charset=utf-8' // GAS prefers text/plain for CORS
                    },
                    body: JSON.stringify(payload)
                });

                alert("Email sent successfully!");
            } catch (err) {
                console.error(err);
                alert("Error sending email. Check console.");
            } finally {
                btn.innerText = "Send Email";
                btn.disabled = false;
            }
        }

        // Prompt login on load if no token
        window.onload = () => {
            setTimeout(() => { if(!access_token) document.getElementById('loginBtn').style.display = 'block'; }, 1000);
        };
    </script>
</body>
</html>
