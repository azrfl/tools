<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penulis Peribadi (Speech to Text)v1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f7fb;
            color: #333;
        }
        h2 { text-align: center; color: #2c3e50; }
        .controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        #btnStart { background-color: #2ecc71; color: white; }
        #btnStop { background-color: #e74c3c; color: white; }
        button:disabled { background-color: #bdc3c7 !important; cursor: not-allowed; }
        #status { text-align: center; font-style: italic; color: #7f8c8d; margin-bottom: 15px; height: 20px; }
        textarea { width: 100%; height: 300px; padding: 15px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 8px; box-sizing: border-box; resize: vertical; }
    </style>
</head>
<body>

    <h2>Penulis Peribadi (Bahasa Melayu)</h2>
   
    <div class="controls">
        <button id="btnStart">Mula Mendengar</button>
        <button id="btnStop" disabled>Berhenti</button>
    </div>

    <div id="status">Sedia untuk bermula. Tekan "Mula Mendengar".</div>
    <textarea id="output" placeholder="Percakapan anda akan ditaip di sini secara automatik..."></textarea>

    <script>
        // ============================================================
        // 1. DECLARING THE WEB SPEECH API
        // ============================================================
        // This targets the browser's built-in Web Speech engine.
        // Chrome requires the 'webkit' prefix, which is why we include both.
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
       
        // Check if the user's browser supports the Web Speech API
        if (!SpeechRecognition) {
            document.getElementById('status').innerText = "Error: Your browser does not support the Web Speech API. Please use Google Chrome.";
            document.getElementById('btnStart').disabled = true;
        } else {
           
            // Initialize the Web Speech API object
            const recognition = new SpeechRecognition();
           
            // ============================================================
            // 2. CONFIGURING THE API FOR BAHASA MELAYU
            // ============================================================
            recognition.lang = 'ms-MY';        // Tells the API to listen for Malay
            recognition.continuous = true;     // Keeps listening until you click Stop
            recognition.interimResults = true; // Shows text on screen while you are still speaking

            // DOM Elements
            const btnStart = document.getElementById('btnStart');
            const btnStop = document.getElementById('btnStop');
            const status = document.getElementById('status');
            const output = document.getElementById('output');
            let finalTranscript = '';

            // ============================================================
            // 3. CONTROLLING THE API (START / STOP)
            // ============================================================
            btnStart.addEventListener('click', () => {
                recognition.start(); // Starts the Web Speech API mic recording
                btnStart.disabled = true;
                btnStop.disabled = false;
                status.innerText = "Sistem sedang mendengar... Sila bercakap.";
            });

            btnStop.addEventListener('click', () => {
                recognition.stop(); // Stops the Web Speech API mic recording
                btnStart.disabled = false;
                btnStop.disabled = true;
                status.innerText = "Sistem berhenti mendengar.";
            });

            // ============================================================
            // 4. RECEIVING THE TEXT FROM THE API
            // ============================================================
            recognition.onresult = (event) => {
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + ' ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Update the textarea with the spoken words
                output.value = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                status.innerText = "Ralat dikesan: " + event.error;
            };

            // Auto-restart if the API drops the connection unexpectedly
            recognition.onend = () => {
                if (btnStop.disabled === false) {
                    recognition.start();
                }
            };
        }
    </script>

</body>
</html>
